name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build-android-apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
          dotnet-quality: 'preview'

      - name: Install MAUI workload
        run: dotnet workload install maui-android

      - name: Restore dependencies
        run: dotnet restore THWTicketApp.csproj

      - name: Publish Android APK
        run: dotnet publish THWTicketApp.csproj -f net10.0-android -c Release -o ./artifacts/android

      - name: Upload Android artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: ./artifacts/android/**/*.apk
          retention-days: 30

  build-windows-msix:
    name: Build Windows MSIX
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
          dotnet-quality: 'preview'

      - name: Install MAUI workload
        run: dotnet workload install maui-windows

      - name: Restore dependencies
        run: dotnet restore THWTicketApp.csproj

      - name: Publish Windows
        run: dotnet publish THWTicketApp.csproj -f net10.0-windows10.0.19041.0 -c Release -o ./artifacts/windows

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-msix
          path: ./artifacts/windows/
          retention-days: 30

  create-release:
    name: Create GitHub Release
    needs: [build-android-apk, build-windows-msix]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download Android artifact
        uses: actions/download-artifact@v4
        with:
          name: android-apk
          path: ./release/android

      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: windows-msix
          path: ./release/windows

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            ./release/android/**/*.apk
            ./release/windows/**/*.msix
