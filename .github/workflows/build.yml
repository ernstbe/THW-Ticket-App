name: Build & Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-android:
    name: Build Android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
          dotnet-quality: 'preview'

      - name: Install MAUI workload
        run: dotnet workload install maui-android

      - name: Restore dependencies
        run: dotnet restore THWTicketApp.csproj /p:TargetFrameworks=net10.0-android

      - name: Build Android
        run: dotnet build THWTicketApp.csproj -f net10.0-android -c Release --no-restore

  build-windows:
    name: Build Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
          dotnet-quality: 'preview'

      - name: Install MAUI workloads
        run: dotnet workload install maui-windows maui-android

      - name: Restore dependencies
        run: dotnet restore THWTicketApp.csproj

      - name: Build Windows
        run: dotnet build THWTicketApp.csproj -f net10.0-windows10.0.19041.0 -c Release --no-restore

  security:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
          dotnet-quality: 'preview'

      - name: Install MAUI workload
        run: dotnet workload install maui-android

      - name: Check for vulnerable packages
        run: |
          dotnet restore THWTicketApp.csproj /p:TargetFrameworks=net10.0-android
          dotnet list THWTicketApp.csproj package --vulnerable --include-transitive 2>&1 | tee audit.txt
          if grep -q "has the following vulnerable packages" audit.txt; then
            echo "::error::Vulnerable NuGet packages detected!"
            exit 1
          fi
